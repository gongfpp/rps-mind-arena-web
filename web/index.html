<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#091222;color:#ebdfc4;font-family:system-ui,sans-serif}body{overflow:hidden}#canvas{display:block;image-rendering:pixelated}#canvas:focus{outline:none}#gate{position:fixed;inset:0;display:grid}p{line-height:1.9;color:#aeb9c9}button{background:#dfcfac;color:#111c2e;border:3px double #fff1cb;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 4px #4c4439}button:hover{background:#f0dfb5}button:active{transform:translateY(2px);box-shadow:0 2px #4c4439}button:focus-visible{outline:3px solid #63b9d0;outline-offset:6px}button:disabled{opacity:.5;cursor:wait}progress{width:100%;height:9px;accent-color:#dfb96e}small{display:block;line-height:1.8}#failure{color:#e99b8e}noscript{position:fixed;inset:30%;z-index:2;background:#091222}
/* The launch page shares the game's theme artwork; all text remains HTML. */
@font-face{font-family:Pixel;src:url('launch-font.ttf') format('truetype');font-display:swap}
[hidden]{display:none!important}#gate{overflow:auto;place-items:center end;background:#091222;padding:clamp(20px,5vw,80px)}
#gate::before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,transparent 15%,#09122299 55%,#091222f5),url('launch-world.png') center/cover;image-rendering:pixelated;pointer-events:none}
article{position:relative;width:min(530px,100%);border:1px solid #63778f;background:#091222dc;padding:clamp(24px,4vw,48px);text-align:left;box-shadow:0 0 0 4px #111f34,0 18px 80px #0008}
.eyebrow{font:14px Pixel,monospace;letter-spacing:.13em;color:#dfb96e;margin:0 0 24px}h1{font:clamp(64px,8vw,104px) Pixel,monospace;letter-spacing:.12em;text-indent:0;line-height:1.2;margin:0 0 6px;color:#ebdfc4}.subtitle{font:13px Pixel,monospace;letter-spacing:.18em;color:#9ca8b6;margin:0 0 26px}
.pitch{font-size:18px;margin:0 0 30px;color:#ebdfc4;line-height:1.9}button{width:100%;font-size:18px;padding:16px 20px}#message{font-size:14px;min-height:26px;margin:18px 0 8px}.keys{border-top:1px solid #63778f66;padding-top:20px;font-size:13px;line-height:2;color:#aeb9c9}kbd{font:inherit;color:#ebdfc4}small{font-size:12px;margin-top:16px;color:#9ca8b6}#failure{font-size:14px}progress{margin:0 0 12px}#version{margin-top:26px;color:#dfb96e;font:12px Pixel,monospace;letter-spacing:.08em}#canvas{touch-action:none}
@media(max-width:700px){#gate{place-items:center;padding:24px}#gate::before{background-image:linear-gradient(#09122255,#091222ee),url('launch-world.png')}article{background:#091222de}}
@media(max-height:600px){#gate{place-items:start end;padding:18px}article{padding:24px}h1{font-size:60px}.pitch{margin-bottom:16px}.eyebrow{margin-bottom:10px}small{margin-top:10px}}
</style>

</head><body>

<div id="gate"><article>
<p class="eyebrow">月下三路 · 一拳定局</p><h1>拳局</h1><p class="subtitle">RPS : MIND ARENA</p><p class="pitch">观察对手、分配专注、部署三路。踏入黑雾之城，让每一次出拳都成为选择。</p>

</article></div>

<script src="index.js"></script>
<script>
const COPY={"web.title": "拳局", "web.canvas": "拳局游戏画面", "web.subtitle": "观察对手、分配专注、部署三路。踏入黑雾之城，让每一次出拳都成为选择。", "web.no_script": "请开启浏览器的 JavaScript 后重新加载。", "web.loading": "灯火正在亮起…", "web.ready": "第一章 · 黑雾之城", "web.start": "进入游戏", "web.retry": "重新加载", "web.failed": "游戏未能载入。请检查网络后重试，或使用较新的桌面浏览器。", "web.http": "请通过随包说明中的本地服务打开游戏，不能直接双击此文件。", "web.unsupported": "当前浏览器缺少运行游戏所需的图形功能。请尝试开启硬件加速，或换用较新的桌面浏览器。", "web.save": "旅程自动保存在当前浏览器的站点数据中。清除数据、隐私模式或浏览器回收存储可能导致丢失。推荐桌面浏览器、键盘和鼠标。", "web.description": "月下三路，一拳定局。观察对手、分配专注、部署三路，踏入黑雾之城。", "web.eyebrow": "月下三路 · 一拳定局", "web.controls": "选牌 1–5 · 部署 A / S / D · 揭牌 Space · 暂停 Esc", "web.preparing": "下载完成，正在唤醒黑雾之城…", "web.context_lost": "浏览器的图形连接已中断。请重新加载，从上一次自动保存的位置继续。"};
const config={"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":17048512,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
let engine;
const gate=document.getElementById('gate'),button=document.getElementById('start'),progress=document.getElementById('progress'),message=document.getElementById('message'),failure=document.getElementById('failure');
let starting=false,interrupted=false;
const canvas=document.getElementById('canvas');
function fail(error,copy='web.failed'){if(error)console.error(error);gate.hidden=false;failure.textContent=COPY[copy];failure.hidden=false;message.textContent='';progress.hidden=true;button.hidden=false;button.textContent=COPY['web.retry'];button.disabled=false;starting=false;button.onclick=()=>location.reload();button.focus();}
canvas.addEventListener('webglcontextlost',()=>{interrupted=true;fail(null,'web.context_lost');});
button.onclick=async()=>{
 if(starting)return; starting=true;button.disabled=true;progress.hidden=false;message.textContent=COPY['web.loading'];
 try{
  if(location.protocol==='file:'){failure.textContent=COPY['web.http'];failure.hidden=false;button.hidden=true;progress.hidden=true;message.textContent='';return;}
  if(typeof Engine==='undefined'){fail(null);return;}
  const missing=Engine.getMissingFeatures({threads:false});
  if(missing.length){failure.textContent=COPY['web.unsupported'];failure.hidden=false;button.hidden=true;progress.hidden=true;message.textContent='';return;}
  engine=new Engine(config);
  await engine.startGame({onProgress:(current,total)=>{if(total>0){progress.value=current;progress.max=total;const percent=Math.min(100,Math.round(current/total*100));message.textContent=percent<100?COPY['web.loading']+' '+percent+'%':COPY['web.preparing'];}}});
  if(interrupted)return;
  gate.hidden=true;canvas.focus();
}catch(error){fail(error);}
};
message.textContent=COPY['web.ready'];
button.disabled=false;
button.focus();
</script></body></html>
